<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SKCW Help Center</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

/* 🔥 EXACT SAME STYLE (NO CHANGE) */
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:url("banner.jpeg") no-repeat center/cover fixed;
color:white;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:linear-gradient(135deg, rgba(0,0,30,0.95), rgba(0,20,60,0.9));
z-index:-1;
}

nav{
position:sticky;
top:0;
display:flex;
justify-content:center;
align-items:center;
gap:25px;
padding:12px;
background:rgba(0,0,0,0.8);
backdrop-filter:blur(15px);
border-bottom:2px solid #00eaff;
overflow-x:auto;
white-space:nowrap;
}

nav a{
color:#00eaff;
text-decoration:none;
font-weight:600;
font-size:15px;
padding:5px 10px;
}

nav a:hover{
color:white;
text-shadow:0 0 10px #00eaff;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.search-box{
width:100%;
padding:14px;
border-radius:12px;
border:none;
margin-bottom:15px;
}

.suggestions{
background:#111;
border-radius:10px;
overflow:hidden;
margin-bottom:15px;
display:none;
}

.suggestions div{
padding:10px;
cursor:pointer;
border-bottom:1px solid #222;
}

.suggestions div:hover{
background:#00eaff;
color:black;
}

.card{
background:rgba(255,255,255,0.05);
margin:10px 0;
padding:15px;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.card:hover{
box-shadow:0 0 15px rgba(0,234,255,0.4);
}

.card h3{
color:#00eaff;
font-size:16px;
}

.answer{
display:none;
margin-top:10px;
color:#ccc;
}

.card.active .answer{
display:block;
}

.no-result{
display:none;
text-align:center;
margin-top:20px;
}

.btn{
display:inline-block;
margin:10px;
padding:10px 20px;
background:#00eaff;
color:black;
border-radius:20px;
text-decoration:none;
font-weight:bold;
}

header{
text-align:center;
padding:40px 10px;
}

header h1{
color:#00eaff;
}

</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="Posts.html">Posts</a>
<a href="chatbot.html">AI Assistant</a>
<a href="help.html">Help</a>
</nav>

<header>
<h1>📘 Help Center</h1>
<p style="color:#bbb;">Basic → Advanced Computer Knowledge</p>
</header>

<div class="container">

<input type="text" id="search" class="search-box" placeholder="Search anything..." onkeyup="searchFunc()">

<div id="suggestions" class="suggestions"></div>

<div id="faq"></div>

<div class="no-result" id="noResult">
<h3>No results found</h3>

<p style="color:#bbb;font-size:14px;">
Try another question or use these:
</p>

<a href="chatbot.html" class="btn">Ask AI Assistant</a>
<a href="mailto:sks.com.world@gmail.com" class="btn">Contact Me</a>
</div>

</div>

<script>

/* 🔥 LEVEL SYSTEM */
const levels = [
"basic","beginner","intermediate",
"advanced","expert","complex"
];

const topics = [
"html","css","javascript","computer",
"internet","ai","cpu","ram",
"programming","database","network",
"cyber security","cloud computing"
];

/* 🔥 GENERATE 1 LAKH QUESTIONS (SMART) */
let questions = [];

for(let i=0;i<100000;i++){
let level = levels[i % levels.length];
let topic = topics[i % topics.length];

let q = `What is ${topic} (${level} level) - ${i+1}?`;

let a = `${topic.toUpperCase()} explanation (${level}):
This is a ${level} level explanation of ${topic}. It helps users understand concepts from basic to advanced in a structured way.`;

questions.push({q,a});
}

/* ⚡ PERFORMANCE LIMIT (VERY IMPORTANT) */
function render(list){
let faq = document.getElementById("faq");
faq.innerHTML="";

/* ONLY LOAD 50 AT A TIME */
list.slice(0,50).forEach(item=>{
let div=document.createElement("div");
div.className="card";
div.innerHTML=`<h3>${item.q}</h3><div class="answer">${item.a}</div>`;
div.onclick=()=>div.classList.toggle("active");
faq.appendChild(div);
});
}

/* SEARCH */
function searchFunc(){
let input=document.getElementById("search").value.toLowerCase();
let suggestionsBox=document.getElementById("suggestions");

if(!input){
render(questions);
suggestionsBox.style.display="none";
document.getElementById("noResult").style.display="none";
return;
}

let filtered = questions.filter(q=>q.q.toLowerCase().includes(input));

render(filtered);

document.getElementById("noResult").style.display = filtered.length ? "none" : "block";

/* AUTO SUGGEST */
suggestionsBox.innerHTML="";
if(filtered.length>0){
suggestionsBox.style.display="block";

filtered.slice(0,5).forEach(item=>{
let div=document.createElement("div");
div.innerText=item.q;

div.onclick=()=>{
document.getElementById("search").value=item.q;
suggestionsBox.style.display="none";
searchFunc();
};

suggestionsBox.appendChild(div);
});

}else{
suggestionsBox.style.display="none";
}
}

/* INITIAL LOAD */
render(questions);

</script>

</body>
</html>
