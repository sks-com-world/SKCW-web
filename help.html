<html lang="en">
<head>
<meta charset="UTF-8">
<title>Help Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* YOUR ORIGINAL STYLE (UNCHANGED) */
body{
margin:0;
font-family:Arial;
background:#0a0f1f;
color:white;
}

nav{
display:flex;
justify-content:center;
gap:20px;
padding:10px;
background:#000;
border-bottom:2px solid #00eaff;
}

nav a{
color:#00eaff;
text-decoration:none;
font-size:14px;
}

.container{

margin:auto;

}

input{
width:100%;
padding:12px;
border-radius:10px;
border:none;
margin-bottom:20px;
}

.card{
background:#151c3d;
padding:15px;
margin:8px 0;
border-radius:10px;
cursor:pointer;
}

.answer{
display:none;
color:#ccc;
margin-top:8px;
}

.card.active .answer{
display:block;
}

/* KEEP YOUR ORIGINAL NO RESULT STYLE */
.no-result{
display:none;
text-align:center;
margin-top:20px;
}

</style>
</head>

<body>

<nav>
<a href="index.html">Home</a>
<a href="Posts.html">Posts</a>
<a href="chatbot.html">AI Assistant</a>
<a href="help.html">Help</a>
</nav>

<div class="container">

<input type="text" id="search" placeholder="Search questions..." onkeyup="searchFunc()">

<div id="faq">

<!-- YOUR ORIGINAL QUESTIONS (UNCHANGED) -->
<div class="card"><h3>What is HTML?</h3><div class="answer">HTML builds web pages.</div></div>
<div class="card"><h3>What is CSS?</h3><div class="answer">CSS styles websites.</div></div>
<div class="card"><h3>What is JavaScript?</h3><div class="answer">JS adds interactivity.</div></div>
<div class="card"><h3>What is computer?</h3><div class="answer">Electronic device.</div></div>

</div>

<!-- ✅ ONLY CHANGE STARTS HERE -->
<div class="no-result" id="noResult">

<h3>No results found</h3>

<p style="color:#bbb; font-size:14px;">
You can still continue using these options:
</p>

<a href="chatbot.html" style="
display:inline-block;
margin:10px;
padding:10px 20px;
background:#00eaff;
color:black;
border-radius:20px;
text-decoration:none;
font-weight:bold;">
Ask AI Assistant
</a>

<a href="mailto:sks.com.world@gmail.com" style="
display:inline-block;
margin:10px;
padding:10px 20px;
background:#00eaff;
color:black;
border-radius:20px;
text-decoration:none;
font-weight:bold;">
Contact Me
</a>

</div>
<!-- ✅ ONLY CHANGE ENDS HERE -->

</div>

<script>

function searchFunc(){
let input=document.getElementById("search").value.toLowerCase();
let cards=document.querySelectorAll(".card");
let found=false;

cards.forEach(card=>{
let text=card.innerText.toLowerCase();
if(text.includes(input)){
card.style.display="block";
found=true;
}else{
card.style.display="none";
}
});

document.getElementById("noResult").style.display = found ? "none" : "block";
}

document.querySelectorAll(".card").forEach(card=>{
card.onclick=()=>card.classList.toggle("active");
});

</script>

</body>
</html>
