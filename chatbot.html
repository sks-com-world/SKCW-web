<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SKCW AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ===== GLOBAL ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url("banner.jpeg") center/cover fixed;
    color: white;
    overflow-x: hidden;
}

/* DARK OVERLAY */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,40,0.9);
    z-index: -1;
}

/* ===== HEADER ===== */
header {
    text-align: center;
    padding: 15px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

header h2 {
    margin: 0;
    color: #00eaff;
}

header p {
    margin: 5px 0 0;
    font-size: 13px;
    color: #aaa;
}

/* ===== CHAT AREA ===== */
.chat {
    max-width: 700px;
    margin: auto;
    padding: 15px;
    height: 75vh;
    overflow-y: auto;
    scroll-behavior: smooth;
}

/* ===== MESSAGE ===== */
.msg {
    padding: 12px 16px;
    border-radius: 15px;
    margin: 10px 0;
    max-width: 75%;
    line-height: 1.5;

    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
}

/* USER */
.user {
    background: linear-gradient(45deg, #0077ff, #00c6ff);
    margin-left: auto;
}

/* BOT */
.bot {
    background: rgba(255,255,255,0.1);
}

/* LINK STYLE */
.msg a {
    color: #00eaff;
    text-decoration: none;
    font-weight: bold;
}

/* ===== INPUT AREA ===== */
.input-box {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background: #111;
    padding: 10px;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: #00eaff;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00c4d6;
}

</style>
</head>

<body>

<header>
<h2>🤖 SKCW AI Assistant</h2>
<p>Smart Technology + General Query Assistant</p>
</header>

<div class="chat" id="chat"></div>

<div class="input-box">
<input id="input" placeholder="Ask anything..." onkeydown="if(event.key==='Enter') send()">
<button onclick="send()">Send</button>
</div>

<script>

const chat = document.getElementById("chat");

/* ADD MESSAGE */
function add(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* BOT REPLY (Typing effect) */
function botReply(text) {
    let div = document.createElement("div");
    div.className = "msg bot";
    chat.appendChild(div);

    let i = 0;
    let interval = setInterval(() => {
        div.innerText += text[i];
        i++;
        if(i >= text.length) clearInterval(interval);
    }, 12);

    chat.scrollTop = chat.scrollHeight;
}

/* ADD LINK */
function addLink(text, url) {
    let div = document.createElement("div");
    div.className = "msg bot";

    let a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.innerText = text;

    div.appendChild(a);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* MAIN AI SYSTEM */
function send() {

    let inputBox = document.getElementById("input");
    let q = inputBox.value.trim();
    let lower = q.toLowerCase();

    if(!q) return;

    add(q, "user");
    inputBox.value = "";

    setTimeout(() => {

        /* ===== BASIC KNOWLEDGE ===== */
        if(lower.includes("html")) {
            botReply("HTML is the foundation of web pages. It defines structure such as headings, text, images, and links.");
        }

        else if(lower.includes("css")) {
            botReply("CSS is used to style and design websites. It controls layout, colors, fonts, and responsiveness.");
        }

        else if(lower.includes("javascript") || lower.includes("js")) {
            botReply("JavaScript makes websites interactive, handling clicks, animations, and dynamic content.");
        }

        else if(lower.includes("ai")) {
            botReply("Artificial Intelligence enables machines to simulate human thinking, learning, and decision-making.");
        }

        else if(lower.includes("computer")) {
            botReply("A computer is an electronic device that processes data and performs tasks using programs.");
        }

        else if(lower.includes("website")) {
            botReply("A website is a collection of web pages accessible through the internet.");
        }

        /* ===== SMART RESPONSE FOR UNKNOWN ===== */
        else {

            botReply("🧠 I currently do not have enough training data to answer this question accurately.");

            setTimeout(() => {

                botReply("However, you can still get a reliable answer using advanced AI systems or search engines.");

                setTimeout(() => {

                    addLink("👉 Ask on ChatGPT",
                    "https://chat.openai.com/?q=" + encodeURIComponent(q));

                    addLink("🔍 Search on Google",
                    "https://www.google.com/search?q=" + encodeURIComponent(q));

                    setTimeout(() => {
                        botReply("📌 Note: The information from these links is provided by external systems like ChatGPT or Google, not by this assistant.");
                    }, 800);

                }, 800);

            }, 800);
        }

    }, 400);
}

</script>

</body>
</html>
