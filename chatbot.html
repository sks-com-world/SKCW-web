<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SKCW AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* BODY */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url("banner.jpeg") center/cover fixed;
    color: white;
}

/* OVERLAY */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,30,0.9);
    z-index: -1;
}

/* HEADER */
header {
    text-align: center;
    padding: 20px;
}

header h1 {
    color: #00eaff;
}

/* CHAT BOX */
.chatbox {
    max-width: 500px;
    margin: 30px auto;
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
}

/* BUTTON */
button {
    width: 100%;
    margin-top: 10px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(45deg, #00eaff, #0077ff);
    font-weight: bold;
}

/* OUTPUT */
#response {
    margin-top: 15px;
    font-size: 14px;
    color: #ccc;
}

/* BACK BUTTON */
.back {
    display: block;
    text-align: center;
    margin-top: 20px;
    color: #00eaff;
    text-decoration: none;
}

</style>
</head>

<body>

<header>
    <h1>🤖 SKCW AI Assistant</h1>
    <p>Ask anything about Computer Technology</p>
</header>

<div class="chatbox">

    <input id="question" placeholder="Ask about coding, tech, AI...">

    <button onclick="processQuestion()">Ask</button>

    <div id="response"></div>

</div>

<a class="back" href="index.html">⬅ Back to Home</a>

<script>

function processQuestion() {

    let q = document.getElementById("question").value.toLowerCase();
    let res = document.getElementById("response");

    // TECH RELATED KEYWORDS
    let techWords = [
        "computer","coding","programming","html","css","javascript",
        "python","ai","technology","software","hardware","app","website"
    ];

    let isTech = techWords.some(word => q.includes(word));

    if(!isTech) {
        res.innerText = "⚠️ This question is not related to Computer Technology. Please ask relevant questions.";
        return;
    }

    // SMART REDIRECT LOGIC

    if(q.includes("video") || q.includes("youtube")) {
        res.innerText = "🎬 Redirecting you to YouTube for better learning...";
        window.open("https://www.youtube.com/results?search_query=" + q);
    }
    else if(q.includes("code") || q.includes("programming") || q.includes("html")) {
        res.innerText = "💻 Redirecting to AI for coding help...";
        window.open("https://chat.openai.com/");
    }
    else if(q.includes("website") || q.includes("post")) {
        res.innerText = "🌐 Opening your learning posts...";
        window.open("Posts.html");
    }
    else {
        res.innerText = "🔍 Searching Google for best results...";
        window.open("https://www.google.com/search?q=" + q);
    }

}

</script>

</body>
</html>
