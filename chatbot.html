<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SKCW AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url("banner.jpeg") center/cover fixed;
    color: white;
}

/* DARK OVERLAY */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,40,0.9);
    z-index: -1;
}

/* HEADER */
header {
    text-align: center;
    padding: 15px;
    color: #00eaff;
}

/* CHAT AREA */
.chat-container {
    max-width: 600px;
    margin: auto;
    padding: 15px;
}

/* MESSAGES */
.message {
    padding: 10px 15px;
    border-radius: 15px;
    margin: 10px 0;
    max-width: 80%;
}

.user {
    background: #0077ff;
    margin-left: auto;
}

.bot {
    background: rgba(255,255,255,0.1);
}

/* INPUT */
.input-area {
    position: fixed;
    bottom: 0;
    width: 100%;
    background: #111;
    display: flex;
    padding: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
}

button {
    margin-left: 10px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #00eaff;
    font-weight: bold;
}

</style>
</head>

<body>

<header>
<h2>🤖 SKCW AI Assistant</h2>
<p>Smart Tech Helper</p>
</header>

<div class="chat-container" id="chat"></div>

<div class="input-area">
<input id="input" placeholder="Ask about technology...">
<button onclick="send()">Send</button>
</div>

<script>

const chat = document.getElementById("chat");

/* ADD MESSAGE */
function addMessage(text, type) {
    let div = document.createElement("div");
    div.className = "message " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* TYPING EFFECT */
function typing(text) {
    let div = document.createElement("div");
    div.className = "message bot";
    chat.appendChild(div);

    let i = 0;
    let interval = setInterval(() => {
        div.innerText += text[i];
        i++;
        if(i >= text.length) clearInterval(interval);
    }, 20);
}

/* MAIN FUNCTION */
function send() {

    let q = document.getElementById("input").value;
    let lower = q.toLowerCase();

    if(!q) return;

    addMessage(q, "user");
    document.getElementById("input").value = "";

    /* TECH CHECK */
    let techWords = ["computer","ai","chatgpt","code","html","css","js","javascript","python","tech","software","hardware","app","website"];
    let isTech = techWords.some(w => lower.includes(w));

    setTimeout(() => {

        if(!isTech) {
            typing("⚠️ This question is outside my domain. Please ask about computer technology.");
            return;
        }

        /* KNOWLEDGE BASE */
        if(lower.includes("chatgpt")) {
            typing("ChatGPT is an advanced AI chatbot that can understand and generate human-like responses.");
        }
        else if(lower.includes("html")) {
            typing("HTML is used to structure web pages.");
        }
        else if(lower.includes("css")) {
            typing("CSS styles and designs websites.");
        }
        else if(lower.includes("javascript")) {
            typing("JavaScript adds interactivity to websites.");
        }
        else if(lower.includes("ai")) {
            typing("AI allows machines to simulate human intelligence.");
        }

        /* YOUTUBE */
        else if(lower.includes("video") || lower.includes("learn")) {
            typing("🎬 Opening YouTube for better learning...");
            window.open("https://www.youtube.com/results?search_query=" + q);
        }

        /* ADVANCED → AI */
        else if(q.length > 25) {
            typing("🧠 Advanced query detected... Redirecting to AI...");
            window.open("https://chat.openai.com/");
        }

        /* DEFAULT GOOGLE */
        else {
            typing("🔍 Searching Google...");
            window.open("https://www.google.com/search?q=" + q);
        }

    }, 500);
}

</script>

</body>
</html>
