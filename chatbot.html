<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SKCW AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url("banner.jpeg") center/cover fixed;
    color: white;
}

/* Overlay */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,40,0.9);
    z-index: -1;
}

/* Header */
header {
    text-align: center;
    padding: 15px;
    color: #00eaff;
}

/* Chat */
.chat {
    max-width: 650px;
    margin: auto;
    padding: 15px;
}

/* Messages */
.msg {
    padding: 12px 16px;
    border-radius: 15px;
    margin: 10px 0;
    max-width: 80%;
    line-height: 1.5;
}

.user {
    background: #0077ff;
    margin-left: auto;
}

.bot {
    background: rgba(255,255,255,0.1);
}

/* Input */
.input-box {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background: #111;
    padding: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
}

button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: #00eaff;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
<h2>🤖 SKCW AI Assistant</h2>
<p>Smart Technology Guide</p>
</header>

<div class="chat" id="chat"></div>

<div class="input-box">
<input id="input" placeholder="Ask about technology...">
<button onclick="send()">Send</button>
</div>

<script>

const chat = document.getElementById("chat");

/* Add message */
function add(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* Typing effect */
function botReply(text) {
    let div = document.createElement("div");
    div.className = "msg bot";
    chat.appendChild(div);

    let i = 0;
    let interval = setInterval(() => {
        div.innerText += text[i];
        i++;
        if(i >= text.length) clearInterval(interval);
    }, 15);
}

/* Add link button */
function addLink(text, url) {
    let div = document.createElement("div");
    div.className = "msg bot";

    let a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.innerText = text;
    a.style.color = "#00eaff";

    div.appendChild(a);
    chat.appendChild(div);
}

/* MAIN AI */
function send() {

    let q = document.getElementById("input").value;
    let lower = q.toLowerCase();

    if(!q) return;

    add(q, "user");
    document.getElementById("input").value = "";

    setTimeout(() => {

        /* TECH FILTER */
        let techWords = ["computer","ai","chatgpt","html","css","javascript","python","coding","software","hardware","technology","app","website"];
        let isTech = techWords.some(word => lower.includes(word));

        if(!isTech) {
            botReply("⚠️ This query appears to be outside my domain. I am currently designed to assist only with computer technology related topics.");
            return;
        }

        /* BASIC KNOWLEDGE */
        if(lower.includes("html")) {
            botReply("HTML is the foundation of web pages. It defines structure like headings, text, images, and links.");
        }

        else if(lower.includes("css")) {
            botReply("CSS is used to style websites. It controls colors, layout, spacing, and responsiveness.");
        }

        else if(lower.includes("javascript")) {
            botReply("JavaScript enables interactivity such as buttons, animations, and dynamic updates.");
        }

        else if(lower.includes("ai")) {
            botReply("Artificial Intelligence allows machines to simulate human thinking and problem-solving.");
        }

        else if(lower.includes("chatgpt")) {
            botReply("ChatGPT is an advanced AI chatbot capable of answering questions and generating content.");
        }

        /* ADVANCED QUERY DETECTION */
        else if(q.length > 30) {

            botReply("🧠 This appears to be an advanced query beyond my current training.");

            setTimeout(() => {
                botReply("I am a lightweight AI assistant and may not provide a fully accurate answer for this topic.");

                setTimeout(() => {
                    botReply("However, you can explore this using a more advanced AI system.");

                    addLink("👉 Ask ChatGPT", "https://chat.openai.com/");
                }, 1200);
            }, 800);
        }

        /* UNKNOWN */
        else {

            botReply("🤖 I currently do not have enough training data to answer this question accurately.");

            setTimeout(() => {
                botReply("For better accuracy, I recommend exploring trusted sources or advanced AI tools.");

                setTimeout(() => {
                    addLink("🔍 Search on Google", "https://www.google.com/search?q=" + q);
                }, 1200);
            }, 800);
        }

    }, 500);
}

</script>

</body>
</html>
