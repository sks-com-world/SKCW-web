<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SKCW AI Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* BODY */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: url("banner.jpeg") center/cover fixed;
    color: white;
    overflow-x: hidden; /* FIX overflow */
}

/* OVERLAY */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,40,0.9);
    z-index: -1;
}

/* HEADER */
header {
    text-align: center;
    padding: 15px;
    color: #00eaff;
}

/* CHAT BOX */
.chat {
    max-width: 700px;
    margin: auto;
    padding: 15px;
    height: 75vh;
    overflow-y: auto; /* SCROLL FIX */
}

/* MESSAGE */
.msg {
    padding: 12px 16px;
    border-radius: 15px;
    margin: 10px 0;
    max-width: 75%;
    line-height: 1.5;

    /* TEXT FIX */
    word-wrap: break-word;
    overflow-wrap: break-word;
    white-space: pre-wrap;
}

/* USER */
.user {
    background: #0077ff;
    margin-left: auto;
}

/* BOT */
.bot {
    background: rgba(255,255,255,0.1);
}

/* INPUT AREA */
.input-box {
    position: fixed;
    bottom: 0;
    width: 100%;
    display: flex;
    background: #111;
    padding: 10px;
}

input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
}

button {
    margin-left: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 10px;
    background: #00eaff;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00c4d6;
}

</style>
</head>

<body>

<header>
<h2>🤖 SKCW AI Assistant</h2>
<p>Technology Support Bot</p>
</header>

<div class="chat" id="chat"></div>

<div class="input-box">
<input id="input" placeholder="Ask about technology..." onkeydown="if(event.key==='Enter') send()">
<button onclick="send()">Send</button>
</div>

<script>

const chat = document.getElementById("chat");

/* ADD MESSAGE */
function add(text, type) {
    let div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

/* BOT REPLY */
function botReply(text) {
    let div = document.createElement("div");
    div.className = "msg bot";
    chat.appendChild(div);

    let i = 0;
    let interval = setInterval(() => {
        div.innerText += text[i];
        i++;
        if(i >= text.length) clearInterval(interval);
    }, 15);

    chat.scrollTop = chat.scrollHeight;
}

/* ADD LINK */
function addLink(text, url) {
    let div = document.createElement("div");
    div.className = "msg bot";

    let a = document.createElement("a");
    a.href = url;
    a.target = "_blank";
    a.innerText = text;
    a.style.color = "#00eaff";

    div.appendChild(a);
    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;
}

/* MAIN FUNCTION */
function send() {

    let inputBox = document.getElementById("input");
    let q = inputBox.value.trim();
    let lower = q.toLowerCase();

    if(!q) return;

    add(q, "user");
    inputBox.value = "";

    setTimeout(() => {

        /* NON-TECH BLOCK */
        let techWords = ["computer","ai","html","css","javascript","python","coding","software","hardware","technology","website","app"];
        let isTech = techWords.some(word => lower.includes(word));

        if(!isTech) {
            botReply("⚠️ This question is outside my domain. I currently specialize only in computer technology topics.");
            return;
        }

        /* KNOWLEDGE BASE */
        if(lower.includes("html")) {
            botReply("HTML is used to create the structure of web pages like headings, text, images, and links.");
        }

        else if(lower.includes("css")) {
            botReply("CSS is used to design and style web pages, including colors, layouts, and responsiveness.");
        }

        else if(lower.includes("javascript") || lower.includes("js")) {
            botReply("JavaScript makes websites interactive. It handles actions like clicks, animations, and dynamic updates.");
        }

        else if(lower.includes("ai") || lower.includes("artificial intelligence")) {
            botReply("Artificial Intelligence enables machines to simulate human thinking and decision-making.");
        }

        else if(lower.includes("computer")) {
            botReply("A computer is an electronic device that processes data and performs tasks using programs.");
        }

        else if(lower.includes("chatgpt")) {
            botReply("ChatGPT is an AI chatbot that can answer questions, generate content, and assist users.");
        }

        /* UNKNOWN BUT SIMPLE */
        else if(lower.includes("what") || lower.includes("define") || lower.includes("explain")) {

            botReply("🧠 I understand your question, but my current knowledge is limited for detailed explanations.");

            setTimeout(() => {
                botReply("For accurate and complete information, you can use advanced AI systems.");
                
                setTimeout(() => {
                    addLink("👉 Ask on ChatGPT", "https://chat.openai.com/");
                }, 1000);

            }, 1000);
        }

        /* FINAL FALLBACK */
        else {

            botReply("🤖 I am a lightweight AI assistant and I am not trained enough to answer this question accurately.");

            setTimeout(() => {
                botReply("You can explore this topic further using search.");

                setTimeout(() => {
                    addLink("🔍 Search on Google", "https://www.google.com/search?q=" + q);
                }, 1000);

            }, 1000);
        }

    }, 500);
}

</script>

</body>
</html>
